<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5B8A7E">
<meta name="mobile-web-app-capable" content="yes">
<title>دوائي — منبّه الأدوية</title>
<style>
:root{
  --bg:#F4F1EA; --card:#FFFFFF; --ink:#2E3B37; --muted:#7A8783; --line:#E4DFD4;
  --primary:#5B8A7E; --primary-soft:#E3EEEA; --accent:#C9A27E; --accent-soft:#F5ECE2;
  --ok:#6FA287; --ok-soft:#E5F1EA; --warn:#D49A6A; --warn-soft:#F8EBDF; --bad:#C07A7A; --bad-soft:#F5E5E5;
  --radius:18px; --shadow:0 2px 10px rgba(46,59,55,.06);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Tahoma,"Noto Sans Arabic","Noto Naskh Arabic",sans-serif;font-size:16px;line-height:1.6}
body{padding-bottom:calc(88px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}

header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(14px + env(safe-area-inset-top)) 18px 10px}
.hrow{display:flex;align-items:center;justify-content:space-between}
h1{margin:0;font-size:22px;font-weight:700}
.date{color:var(--muted);font-size:14px}
.bell{width:42px;height:42px;border-radius:50%;background:var(--card);box-shadow:var(--shadow);display:grid;place-items:center}
.bell svg{width:22px;height:22px;stroke:var(--primary)}
.bell.off svg{stroke:var(--muted)}

main{padding:4px 16px 16px;max-width:560px;margin:0 auto}
.view{display:none}.view.on{display:block;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.summary{background:var(--primary);color:#fff;border-radius:var(--radius);padding:18px;display:flex;align-items:center;gap:16px;margin-bottom:16px}
.ring{width:72px;height:72px;flex:none}
.ring circle{fill:none;stroke-width:8}
.summary b{font-size:18px;display:block}
.summary span{opacity:.85;font-size:14px}

.sec{font-size:14px;color:var(--muted);margin:18px 4px 8px;font-weight:600}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px;margin-bottom:10px;display:flex;align-items:center;gap:12px}
.dot{width:44px;height:44px;border-radius:14px;flex:none;display:grid;place-items:center;font-weight:700;color:#fff;font-size:18px}
.info{flex:1;min-width:0}
.info .n{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.info .s{color:var(--muted);font-size:13px}
.time{font-weight:700;font-size:15px;direction:ltr;text-align:center;min-width:58px}
.badge{font-size:12px;padding:2px 10px;border-radius:20px;display:inline-block;margin-top:2px}
.b-ok{background:var(--ok-soft);color:var(--ok)}.b-skip{background:var(--bad-soft);color:var(--bad)}
.b-due{background:var(--warn-soft);color:var(--warn)}.b-up{background:var(--primary-soft);color:var(--primary)}
.acts{display:flex;gap:6px}
.btn{padding:10px 16px;border-radius:14px;font-weight:600;font-size:14px}
.btn-p{background:var(--primary);color:#fff}
.btn-s{background:var(--primary-soft);color:var(--primary)}
.btn-g{background:var(--bg);color:var(--muted)}
.btn-d{background:var(--bad-soft);color:var(--bad)}
.ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center}
.ic svg{width:20px;height:20px}
.ic.ok{background:var(--ok-soft);stroke:var(--ok)}.ic.no{background:var(--bad-soft);stroke:var(--bad)}
.ic.ed{background:var(--bg);stroke:var(--muted)}
.card.done{opacity:.7}
.card.due{outline:2px solid var(--warn)}

.empty{text-align:center;color:var(--muted);padding:40px 20px}
.empty svg{width:64px;height:64px;stroke:var(--accent);margin-bottom:8px}

.filter{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px}
.chip{padding:7px 16px;border-radius:20px;background:var(--card);box-shadow:var(--shadow);font-size:14px;white-space:nowrap}
.chip.on{background:var(--primary);color:#fff}
.lg{display:flex;justify-content:space-between;gap:10px;margin-bottom:10px}
.stat{flex:1;background:var(--card);border-radius:14px;padding:10px;text-align:center;box-shadow:var(--shadow)}
.stat b{display:block;font-size:20px}.stat span{font-size:12px;color:var(--muted)}

nav{position:fixed;bottom:0;inset-inline:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px 8px calc(8px + env(safe-area-inset-bottom));z-index:6}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--muted);padding:4px}
nav button svg{width:24px;height:24px;stroke:currentColor}
nav button.on{color:var(--primary);font-weight:700}
.fab{position:fixed;bottom:calc(86px + env(safe-area-inset-bottom));left:20px;width:58px;height:58px;border-radius:50%;background:var(--accent);box-shadow:0 6px 18px rgba(201,162,126,.45);display:grid;place-items:center;z-index:7}
.fab svg{width:28px;height:28px;stroke:#fff}

.sheet-bg{position:fixed;inset:0;background:rgba(46,59,55,.35);display:none;z-index:20;align-items:flex-end;justify-content:center}
.sheet-bg.on{display:flex}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:24px 24px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));max-height:92vh;overflow-y:auto;animation:up .25s ease}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.sheet h2{margin:0 0 14px;font-size:19px}
label{display:block;font-size:14px;color:var(--muted);margin:12px 0 6px;font-weight:600}
.inp{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:14px;background:var(--bg);outline:none}
.inp:focus{border-color:var(--primary);background:#fff}
.times{display:flex;flex-wrap:wrap;gap:8px}
.tpill{display:flex;align-items:center;gap:4px;background:var(--primary-soft);border-radius:12px;padding:4px 6px 4px 4px}
.tpill input{border:0;background:transparent;direction:ltr;width:96px;padding:6px}
.tpill button{width:26px;height:26px;border-radius:50%;color:var(--bad);font-size:18px;line-height:1}
.addt{border:1.5px dashed var(--primary);color:var(--primary);border-radius:12px;padding:8px 14px;font-size:14px}
.colors{display:flex;gap:10px}
.sw{width:34px;height:34px;border-radius:50%;border:3px solid transparent}
.sw.on{border-color:var(--ink)}
.days{display:flex;gap:6px;flex-wrap:wrap}
.day{padding:6px 10px;border-radius:10px;background:var(--bg);font-size:13px;border:1.5px solid var(--line)}
.day.on{background:var(--primary);color:#fff;border-color:var(--primary)}
.row{display:flex;gap:10px;margin-top:20px}.row .btn{flex:1;padding:14px}

.alert{background:var(--card);border-radius:24px;width:calc(100% - 40px);max-width:380px;padding:26px 20px;text-align:center;margin:auto;animation:pop .3s ease}
@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:none;opacity:1}}
.alert .big{width:84px;height:84px;border-radius:50%;margin:0 auto 12px;display:grid;place-items:center;background:var(--primary-soft);animation:pulse 1.6s infinite}
.alert .big svg{width:42px;height:42px;stroke:var(--primary)}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(91,138,126,.35)}50%{box-shadow:0 0 0 16px rgba(91,138,126,0)}}
.alert h3{margin:4px 0;font-size:22px}
.alert p{margin:0 0 18px;color:var(--muted)}
.alert .btn{display:block;width:100%;margin-top:8px;padding:14px}
#alertBg{align-items:center}

.toast{position:fixed;bottom:calc(100px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:14px;font-size:14px;z-index:40;opacity:0;transition:.3s;pointer-events:none}
.toast.on{opacity:1}
.banner{background:var(--accent-soft);color:#8A6A4B;border-radius:14px;padding:12px 14px;font-size:14px;margin-bottom:12px;display:flex;gap:10px;align-items:center}
.st{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.st:last-child{border-bottom:0}
.st .ico{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:700;flex:none}
.st .ico.y{background:var(--ok-soft);color:var(--ok)}.st .ico.n{background:var(--bad-soft);color:var(--bad)}
.st .tx{flex:1;font-size:14px}.st .tx small{display:block;color:var(--muted);font-size:12px}
.st .btn{padding:8px 12px;font-size:13px}
.note{background:var(--accent-soft);color:#8A6A4B;border-radius:12px;padding:10px 12px;font-size:13px;margin-top:12px}
.banner .btn{padding:8px 12px;background:var(--accent);color:#fff;white-space:nowrap}
</style>
</head>
<body>

<header>
  <div class="hrow">
    <div>
      <h1 id="title">جدول اليوم</h1>
      <div class="date" id="today"></div>
    </div>
    <button class="bell" id="bellBtn" aria-label="التنبيهات">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
    </button>
  </div>
</header>

<main>
  <!-- اليوم -->
  <section class="view on" id="v-today">
    <div id="permBanner"></div>
    <div class="summary">
      <svg class="ring" viewBox="0 0 80 80">
        <circle cx="40" cy="40" r="32" stroke="rgba(255,255,255,.25)"/>
        <circle id="ringBar" cx="40" cy="40" r="32" stroke="#fff" stroke-linecap="round" stroke-dasharray="201" stroke-dashoffset="201" transform="rotate(-90 40 40)" style="transition:stroke-dashoffset .6s"/>
        <text id="ringTxt" x="40" y="46" text-anchor="middle" fill="#fff" font-size="17" font-weight="700">0%</text>
      </svg>
      <div><b id="sumTitle">لا توجد جرعات اليوم</b><span id="sumSub">أضف دواءك الأول من زر +</span></div>
    </div>
    <div id="todayList"></div>
  </section>

  <!-- الأدوية -->
  <section class="view" id="v-meds"><div id="medList"></div></section>

  <!-- السجل -->
  <section class="view" id="v-log">
    <div class="filter" id="logFilter">
      <button class="chip on" data-f="7">آخر ٧ أيام</button>
      <button class="chip" data-f="30">آخر ٣٠ يوم</button>
      <button class="chip" data-f="all">الكل</button>
    </div>
    <div class="lg" id="logStats"></div>
    <div id="logList"></div>
  </section>
</main>

<button class="fab" id="fab" aria-label="إضافة دواء">
  <svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
</button>

<nav>
  <button class="on" data-v="today"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>اليوم</button>
  <button data-v="meds"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="9" width="18" height="6" rx="3" transform="rotate(-45 12 12)"/><path d="M8.5 8.5l7 7"/></svg>أدويتي</button>
  <button data-v="log"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9"/></svg>السجل</button>
</nav>

<!-- نموذج الإضافة / التعديل -->
<div class="sheet-bg" id="formBg">
  <div class="sheet">
    <h2 id="formTitle">إضافة دواء</h2>
    <label>اسم الدواء</label>
    <input class="inp" id="fName" placeholder="مثال: بنادول" maxlength="40">
    <label>الجرعة</label>
    <input class="inp" id="fDose" placeholder="مثال: حبة واحدة 500 ملغ" maxlength="40">
    <label>أوقات التناول</label>
    <div class="times" id="fTimes"></div>
    <label>الأيام</label>
    <div class="days" id="fDays"></div>
    <label>اللون</label>
    <div class="colors" id="fColors"></div>
    <label>ملاحظات (اختياري)</label>
    <input class="inp" id="fNote" placeholder="مثال: بعد الأكل" maxlength="60">
    <div class="row">
      <button class="btn btn-g" id="fCancel">إلغاء</button>
      <button class="btn btn-p" id="fSave">حفظ</button>
    </div>
    <div class="row" id="fDelRow" style="margin-top:8px"><button class="btn btn-d" id="fDel">حذف الدواء</button></div>
  </div>
</div>

<!-- نافذة التنبيه -->
<div class="sheet-bg" id="alertBg">
  <div class="alert">
    <div class="big"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg></div>
    <div class="date" id="aTime"></div>
    <h3 id="aName"></h3>
    <p id="aDose"></p>
    <button class="btn btn-p" id="aTake">تناولته ✓</button>
    <button class="btn btn-s" id="aSnooze">ذكّرني بعد ١٠ دقائق</button>
    <button class="btn btn-g" id="aSkip">تخطّي هذه الجرعة</button>
  </div>
</div>

<!-- حالة التنبيهات -->
<div class="sheet-bg" id="statBg">
  <div class="sheet">
    <h2>حالة التنبيهات</h2>
    <div id="statList"></div>
    <div class="note" id="statNote"></div>
    <button class="btn btn-p" id="testBtn" style="width:100%;margin-top:14px;padding:14px">🔔 تجربة التنبيه بعد ١٠ ثوانٍ</button>
    <div class="row" style="margin-top:8px"><button class="btn btn-g" id="appSet">إعدادات التطبيق</button><button class="btn btn-g" id="statClose">إغلاق</button></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
"use strict";
// ---------- أدوات ----------
const $ = s => document.querySelector(s);
const AR = n => String(n).replace(/\d/g, d => "٠١٢٣٤٥٦٧٨٩"[d]);
const pad = n => String(n).padStart(2,"0");
const dkey = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc = s => String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const DAYS = ["الأحد","الاثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"];
const COLORS = ["#5B8A7E","#7C9CB8","#C9A27E","#A88BB0","#C98B8B","#8FA876"];
const fmtTime = t => { let [h,m]=t.split(":").map(Number); const p=h<12?"ص":"م"; h=h%12||12; return AR(h)+":"+AR(pad(m))+" "+p; };
const fmtDate = d => d.toLocaleDateString("ar-SA-u-ca-gregory",{weekday:"long",day:"numeric",month:"long"});

// ---------- التخزين ----------
const store = {
  get(k,def){ try{ const v=localStorage.getItem("dawa_"+k); return v?JSON.parse(v):def; }catch(e){ return def; } },
  set(k,v){ try{ localStorage.setItem("dawa_"+k,JSON.stringify(v)); }catch(e){} }
};
let meds   = store.get("meds",[]);    // {id,name,dose,times[],days[],color,note}
let log    = store.get("log",[]);     // {id,medId,name,dose,date,time,status,at}
let snooze = store.get("snooze",{});  // key -> timestamp
let shown  = store.get("shown",{});   // key -> true (تم التنبيه)
const NATIVE = (typeof window.AndroidBridge !== "undefined") ? window.AndroidBridge : null;
let lastSync = "";
const syncNative = () => { if(!NATIVE) return; const j=JSON.stringify(meds); if(j===lastSync) return; lastSync=j; try{ NATIVE.schedule(j); }catch(e){} };
const save = () => { store.set("meds",meds); store.set("log",log); store.set("snooze",snooze); store.set("shown",shown); syncNative(); };

const keyOf = (medId,date,time) => medId+"|"+date+"|"+time;
const findLog = (medId,date,time) => log.find(l=>l.medId===medId&&l.date===date&&l.time===time);

// ---------- جرعات اليوم ----------
function todayDoses(){
  const now=new Date(), dk=dkey(now), wd=now.getDay(), mins=now.getHours()*60+now.getMinutes();
  const out=[];
  meds.forEach(m=>{
    if(m.days && m.days.length && !m.days.includes(wd)) return;
    m.times.forEach(t=>{
      const [h,mi]=t.split(":").map(Number), tm=h*60+mi;
      const l=findLog(m.id,dk,t);
      let st = l ? l.status : (tm<=mins ? "due" : "up");
      out.push({m,t,tm,st,key:keyOf(m.id,dk,t),date:dk});
    });
  });
  return out.sort((a,b)=>a.tm-b.tm);
}

// ---------- العرض: اليوم ----------
const ICON_OK='<svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg>';
const ICON_NO='<svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>';
const ICON_ED='<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>';
const EMPTY='<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="9" width="18" height="6" rx="3" transform="rotate(-45 12 12)"/><path d="M8.5 8.5l7 7"/></svg><div>';

function renderToday(){
  const d=todayDoses();
  const done=d.filter(x=>x.st==="taken").length, total=d.length;
  const pct = total?Math.round(done/total*100):0;
  $("#ringBar").style.strokeDashoffset = 201 - 201*pct/100;
  $("#ringTxt").textContent = AR(pct)+"٪";
  if(!total){ $("#sumTitle").textContent="لا توجد جرعات اليوم"; $("#sumSub").textContent= meds.length?"استمتع بيومك":"أضف دواءك الأول من زر +"; }
  else { $("#sumTitle").textContent="تناولت "+AR(done)+" من "+AR(total)+" جرعات";
    const next=d.find(x=>x.st==="up"); $("#sumSub").textContent= next?"الجرعة التالية: "+next.m.name+" "+fmtTime(next.t):(done===total?"أحسنت! أكملت جرعات اليوم":"لديك جرعات متأخرة"); }

  if(!total){ $("#todayList").innerHTML = EMPTY+(meds.length?"لا جرعات مجدولة اليوم":"لم تُضف أي دواء بعد")+"</div></div>"; return; }
  const groups=[["due","مستحقة الآن"],["up","قادمة"],["done","مكتملة"]];
  let html="";
  groups.forEach(([g,label])=>{
    const items=d.filter(x=> g==="done" ? (x.st==="taken"||x.st==="skipped") : x.st===g);
    if(!items.length) return;
    html+='<div class="sec">'+label+'</div>';
    items.forEach(x=>{
      const badge = {taken:'<span class="badge b-ok">تم التناول</span>',skipped:'<span class="badge b-skip">تم التخطي</span>',due:'<span class="badge b-due">حان الوقت</span>',up:'<span class="badge b-up">لاحقاً</span>'}[x.st];
      const acts = (x.st==="due"||x.st==="up")
        ? '<div class="acts"><button class="ic no" data-a="skip" data-k="'+x.key+'" aria-label="تخطي">'+ICON_NO+'</button><button class="ic ok" data-a="take" data-k="'+x.key+'" aria-label="تناول">'+ICON_OK+'</button></div>'
        : '<button class="btn btn-g" data-a="undo" data-k="'+x.key+'">تراجع</button>';
      html+='<div class="card '+(g==="done"?"done":"")+(x.st==="due"?" due":"")+'">'+
        '<div class="time">'+fmtTime(x.t)+'</div>'+
        '<div class="dot" style="background:'+x.m.color+'">'+esc(x.m.name.charAt(0))+'</div>'+
        '<div class="info"><div class="n">'+esc(x.m.name)+'</div><div class="s">'+esc(x.m.dose)+(x.m.note?" · "+esc(x.m.note):"")+'</div>'+badge+'</div>'+acts+'</div>';
    });
  });
  $("#todayList").innerHTML=html;
}

// ---------- العرض: الأدوية ----------
function renderMeds(){
  if(!meds.length){ $("#medList").innerHTML=EMPTY+"قائمة أدويتك فارغة<br>اضغط + لإضافة دواء</div></div>"; return; }
  $("#medList").innerHTML='<div class="sec">'+AR(meds.length)+' أدوية</div>'+meds.map(m=>{
    const days = (!m.days||m.days.length===7||!m.days.length)?"يومياً":m.days.map(i=>DAYS[i]).join("، ");
    return '<div class="card"><div class="dot" style="background:'+m.color+'">'+esc(m.name.charAt(0))+'</div>'+
      '<div class="info"><div class="n">'+esc(m.name)+'</div><div class="s">'+esc(m.dose)+'</div>'+
      '<div class="s">'+m.times.map(fmtTime).join(" · ")+' — '+days+'</div></div>'+
      '<button class="ic ed" data-a="edit" data-id="'+m.id+'" aria-label="تعديل">'+ICON_ED+'</button></div>';
  }).join("");
}

// ---------- العرض: السجل ----------
let logRange="7";
function renderLog(){
  let items=log.slice();
  if(logRange!=="all"){ const lim=new Date(); lim.setDate(lim.getDate()-Number(logRange)); const lk=dkey(lim); items=items.filter(l=>l.date>lk); }
  items.sort((a,b)=> (b.date+b.time).localeCompare(a.date+a.time));
  const tk=items.filter(l=>l.status==="taken").length, sk=items.length-tk;
  const rate = items.length?Math.round(tk/items.length*100):0;
  $("#logStats").innerHTML='<div class="stat"><b style="color:var(--ok)">'+AR(tk)+'</b><span>تم تناولها</span></div><div class="stat"><b style="color:var(--bad)">'+AR(sk)+'</b><span>متخطاة</span></div><div class="stat"><b style="color:var(--primary)">'+AR(rate)+'٪</b><span>نسبة الالتزام</span></div>';
  if(!items.length){ $("#logList").innerHTML=EMPTY+"لا توجد سجلات في هذه الفترة</div></div>"; return; }
  let html="", last="";
  items.forEach(l=>{
    if(l.date!==last){ last=l.date; const [y,mo,da]=l.date.split("-").map(Number); html+='<div class="sec">'+fmtDate(new Date(y,mo-1,da))+'</div>'; }
    const m=meds.find(x=>x.id===l.medId), c=m?m.color:"#B5BFBB";
    const at=new Date(l.at);
    html+='<div class="card"><div class="dot" style="background:'+c+'">'+esc(l.name.charAt(0))+'</div><div class="info"><div class="n">'+esc(l.name)+'</div><div class="s">موعد '+fmtTime(l.time)+' · سُجّل '+fmtTime(pad(at.getHours())+":"+pad(at.getMinutes()))+'</div></div>'+
      (l.status==="taken"?'<span class="badge b-ok">تم</span>':'<span class="badge b-skip">تخطي</span>')+'</div>';
  });
  $("#logList").innerHTML=html;
}

function renderAll(){ $("#today").textContent=fmtDate(new Date()); renderToday(); renderMeds(); renderLog(); renderPerm(); }

// ---------- تسجيل الجرعات ----------
function mark(key,status){
  const [medId,date,time]=key.split("|"); const m=meds.find(x=>x.id===medId); if(!m) return;
  log=log.filter(l=>!(l.medId===medId&&l.date===date&&l.time===time));
  log.push({id:uid(),medId,name:m.name,dose:m.dose,date,time,status,at:Date.now()});
  delete snooze[key]; shown[key]=true; save(); renderAll();
  toast(status==="taken"?"تم تسجيل الجرعة ✓":"تم تخطي الجرعة");
}
function undo(key){
  const [medId,date,time]=key.split("|");
  log=log.filter(l=>!(l.medId===medId&&l.date===date&&l.time===time)); save(); renderAll(); toast("تم التراجع");
}

document.addEventListener("click",e=>{
  const b=e.target.closest("[data-a]"); if(!b) return;
  const a=b.dataset.a;
  if(a==="take") mark(b.dataset.k,"taken");
  else if(a==="skip") mark(b.dataset.k,"skipped");
  else if(a==="undo") undo(b.dataset.k);
  else if(a==="edit") openForm(meds.find(m=>m.id===b.dataset.id));
});

// ---------- التنقل ----------
const TITLES={today:"جدول اليوم",meds:"أدويتي",log:"السجل"};
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{
  document.querySelectorAll("nav button").forEach(x=>x.classList.toggle("on",x===b));
  document.querySelectorAll(".view").forEach(v=>v.classList.toggle("on",v.id==="v-"+b.dataset.v));
  $("#title").textContent=TITLES[b.dataset.v]; window.scrollTo(0,0);
});
$("#logFilter").onclick=e=>{ const c=e.target.closest(".chip"); if(!c) return;
  document.querySelectorAll("#logFilter .chip").forEach(x=>x.classList.toggle("on",x===c)); logRange=c.dataset.f; renderLog(); };

// ---------- النموذج ----------
let editing=null, fColor=COLORS[0], fDays=[0,1,2,3,4,5,6];
function timeRow(v){ const d=document.createElement("div"); d.className="tpill";
  d.innerHTML='<input type="time" value="'+v+'" required><button type="button" aria-label="حذف">×</button>';
  d.querySelector("button").onclick=()=>{ if($("#fTimes").querySelectorAll(".tpill").length>1) d.remove(); else toast("يجب وجود وقت واحد على الأقل"); };
  $("#fTimes").insertBefore(d,$("#addT")); }
function openForm(m){
  editing=m||null;
  $("#formTitle").textContent=m?"تعديل الدواء":"إضافة دواء";
  $("#fName").value=m?m.name:""; $("#fDose").value=m?m.dose:""; $("#fNote").value=m?(m.note||""):"";
  fColor=m?m.color:COLORS[meds.length%COLORS.length]; fDays=m&&m.days&&m.days.length?m.days.slice():[0,1,2,3,4,5,6];
  $("#fTimes").innerHTML='<button type="button" class="addt" id="addT">+ وقت آخر</button>';
  $("#addT").onclick=()=>timeRow("20:00");
  (m?m.times:["08:00"]).forEach(timeRow);
  $("#fColors").innerHTML=COLORS.map(c=>'<button type="button" class="sw'+(c===fColor?" on":"")+'" data-c="'+c+'" style="background:'+c+'"></button>').join("");
  $("#fDays").innerHTML=[6,0,1,2,3,4,5].map(i=>'<button type="button" class="day'+(fDays.includes(i)?" on":"")+'" data-d="'+i+'">'+DAYS[i]+'</button>').join("");
  $("#fDelRow").style.display=m?"flex":"none";
  $("#formBg").classList.add("on"); setTimeout(()=>{ if(!m) $("#fName").focus(); },250);
}
const closeForm=()=>$("#formBg").classList.remove("on");
$("#fColors").onclick=e=>{ const s=e.target.closest(".sw"); if(!s) return; fColor=s.dataset.c; document.querySelectorAll(".sw").forEach(x=>x.classList.toggle("on",x===s)); };
$("#fDays").onclick=e=>{ const s=e.target.closest(".day"); if(!s) return; const i=+s.dataset.d;
  fDays=fDays.includes(i)?fDays.filter(x=>x!==i):fDays.concat(i); s.classList.toggle("on"); };
$("#fab").onclick=()=>openForm();
$("#fCancel").onclick=closeForm;
$("#formBg").onclick=e=>{ if(e.target.id==="formBg") closeForm(); };
$("#fSave").onclick=()=>{
  const name=$("#fName").value.trim(), dose=$("#fDose").value.trim();
  const times=[...new Set([...$("#fTimes").querySelectorAll("input")].map(i=>i.value).filter(Boolean))].sort();
  if(!name) return toast("اكتب اسم الدواء");
  if(!times.length) return toast("حدد وقتاً واحداً على الأقل");
  if(!fDays.length) return toast("اختر يوماً واحداً على الأقل");
  const data={name,dose:dose||"جرعة واحدة",times,days:fDays.slice().sort(),color:fColor,note:$("#fNote").value.trim()};
  if(editing) Object.assign(editing,data); else meds.push(Object.assign({id:uid()},data));
  save(); closeForm(); renderAll(); toast(editing?"تم حفظ التعديلات":"تمت إضافة الدواء");
  askPerm();
};
$("#fDel").onclick=()=>{ if(!editing) return; meds=meds.filter(m=>m!==editing); save(); closeForm(); renderAll(); toast("تم حذف الدواء"); };

// ---------- التنبيهات ----------
const canNotify = "Notification" in window;
function nativePerm(){ try{ return NATIVE.hasPermission(); }catch(e){ return true; } }
function renderPerm(){
  const need = meds.length && (NATIVE ? !nativePerm() : (canNotify && Notification.permission==="default"));
  $("#permBanner").innerHTML = need ? '<div class="banner"><span>فعّل الإشعارات ليصلك التذكير في موعد الدواء</span><button class="btn" id="permBtn">تفعيل</button></div>' : "";
  if(need) $("#permBtn").onclick= NATIVE ? ()=>$("#bellBtn").click() : askPerm;
  $("#bellBtn").classList.toggle("off", NATIVE ? !nativePerm() : !(canNotify && Notification.permission==="granted"));
}
function askPerm(){
  if(NATIVE){ try{ NATIVE.requestPermission(); }catch(e){} return; }
  if(canNotify && Notification.permission==="default"){ try{ Notification.requestPermission().then(renderPerm); }catch(e){} }
}
window.onNativePerm = ()=>{ renderPerm(); if($("#statBg").classList.contains("on")) renderStatus(); };
function nativeStatus(){ try{ return JSON.parse(NATIVE.status()||"{}"); }catch(e){ return {}; } }
function renderStatus(){
  const st=nativeStatus();
  const rows=[
    ["permission","إذن الإشعارات","بدونه لا يظهر أي تنبيه","notif"],
    ["channel","قناة «مواعيد الدواء» مفعّلة بأهمية عالية","حتى يظهر التنبيه أعلى الشاشة","channel"],
    ["sound","صوت التنبيه","الصوت مفعّل في القناة","channel"],
    ["exact","المنبّه الدقيق","حتى يرنّ في الدقيقة المحددة","exact"],
    ["battery","مستثنى من توفير البطارية","حتى لا يوقفه النظام وهو مغلق","battery"],
    ["fullscreen","الظهور على الشاشة كاملة","فوق شاشة القفل","fullscreen"]
  ];
  $("#statList").innerHTML=rows.map(([k,t,sub,fix])=>{
    const ok=st[k]!==false;
    return '<div class="st"><div class="ico '+(ok?'y':'n')+'">'+(ok?'✓':'!')+'</div><div class="tx">'+t+'<small>'+sub+'</small></div>'+(ok?'':'<button class="btn btn-p" data-fix="'+fix+'">إصلاح</button>')+'</div>';
  }).join("");
  let n="عدد المنبّهات المجدولة: "+AR(st.count||0);
  if(st.next>0){ const d=new Date(st.next); n+=" — التالي: "+fmtTime(pad(d.getHours())+":"+pad(d.getMinutes()))+" "+d.toLocaleDateString("ar-SA-u-ca-gregory",{weekday:"long"}); }
  const mk=String(st.maker||"").toLowerCase();
  if(/xiaomi|redmi|poco|huawei|honor|oppo|realme|vivo|oneplus|samsung|infinix|tecno/.test(mk))
    n+="<br>جوالك ("+esc(st.maker)+"): من «إعدادات التطبيق» فعّل <b>التشغيل التلقائي</b> واجعل البطارية <b>بلا قيود</b>.";
  $("#statNote").innerHTML=n;
  $("#statList").querySelectorAll("[data-fix]").forEach(b=>b.onclick=()=>{
    if(b.dataset.fix==="notif") askPerm(); else { try{ NATIVE.fix(b.dataset.fix); }catch(e){} }
  });
}
$("#testBtn").onclick=()=>{ try{ syncNative(); NATIVE.test(10); toast("انتظر ١٠ ثوانٍ… يمكنك قفل الشاشة أو إغلاق التطبيق"); }catch(e){} };
$("#appSet").onclick=()=>{ try{ NATIVE.fix("app"); }catch(e){} };
$("#statClose").onclick=()=>$("#statBg").classList.remove("on");
$("#statBg").onclick=e=>{ if(e.target.id==="statBg") $("#statBg").classList.remove("on"); };
$("#bellBtn").onclick=()=>{
  if(NATIVE){ renderStatus(); $("#statBg").classList.add("on"); return; }
  if(!canNotify) return toast("المتصفح لا يدعم الإشعارات — ستظهر التنبيهات داخل التطبيق");
  if(Notification.permission==="granted") return toast("الإشعارات مفعّلة ✓");
  if(Notification.permission==="denied") return toast("الإشعارات محظورة — فعّلها من إعدادات المتصفح");
  askPerm();
};
// إجراءات ضغطها المستخدم من إشعار النظام أثناء إغلاق التطبيق
function consumeNative(){
  if(!NATIVE) return;
  let arr=[]; try{ arr=JSON.parse(NATIVE.takePending()||"[]"); }catch(e){}
  arr.forEach(a=>{
    const [medId,date,time]=String(a.key).split("|"); const m=meds.find(x=>x.id===medId); if(!m) return;
    log=log.filter(l=>!(l.medId===medId&&l.date===date&&l.time===time));
    log.push({id:uid(),medId,name:m.name,dose:m.dose,date,time,status:a.status,at:a.at||Date.now()});
    shown[a.key]=true;
  });
  if(arr.length){ save(); renderAll(); }
}
window.onNativeResume = ()=>{ consumeNative(); renderAll(); check(); if($("#statBg").classList.contains("on")) renderStatus(); };

let audioCtx=null;
function chime(){
  try{
    audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)();
    [523.25,659.25,783.99].forEach((f,i)=>{
      const o=audioCtx.createOscillator(), g=audioCtx.createGain(), t=audioCtx.currentTime+i*0.22;
      o.type="sine"; o.frequency.value=f; g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(.25,t+.03); g.gain.exponentialRampToValueAtTime(.001,t+.6);
      o.connect(g).connect(audioCtx.destination); o.start(t); o.stop(t+.65);
    });
  }catch(e){}
}
document.addEventListener("pointerdown",()=>{ try{ audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)(); if(audioCtx.state==="suspended") audioCtx.resume(); }catch(e){} },{once:true});

let current=null, queue=[];
function showAlert(x){
  current=x;
  $("#aName").textContent=x.m.name; $("#aDose").textContent=x.m.dose+(x.m.note?" — "+x.m.note:"");
  $("#aTime").textContent="موعد "+fmtTime(x.t);
  $("#alertBg").classList.add("on");
  chime(); try{ navigator.vibrate && navigator.vibrate([300,150,300,150,300]); }catch(e){}
  if(canNotify && Notification.permission==="granted"){
    try{ const n=new Notification("حان موعد الدواء 💊",{body:x.m.name+" — "+x.m.dose,tag:x.key,requireInteraction:true}); n.onclick=()=>{ window.focus(); n.close(); }; }catch(e){}
  }
}
function nextAlert(){ $("#alertBg").classList.remove("on"); current=null; if(queue.length) setTimeout(()=>showAlert(queue.shift()),400); }
$("#aTake").onclick=()=>{ if(current) mark(current.key,"taken"); nextAlert(); };
$("#aSkip").onclick=()=>{ if(current) mark(current.key,"skipped"); nextAlert(); };
$("#aSnooze").onclick=()=>{ if(current){ snooze[current.key]=Date.now()+10*60000; delete shown[current.key]; save(); toast("سيتم تذكيرك بعد ١٠ دقائق"); } nextAlert(); };

function check(){
  const now=Date.now(), mins=new Date().getHours()*60+new Date().getMinutes();
  todayDoses().forEach(x=>{
    if(x.st!=="due") return;
    if(mins - x.tm > 180) return;                   // لا تنبيه لجرعات فات عليها أكثر من ٣ ساعات
    if(snooze[x.key] && snooze[x.key]>now) return;
    if(shown[x.key] && !snooze[x.key]) return;
    if(current && current.key===x.key) return;
    if(queue.some(q=>q.key===x.key)) return;
    delete snooze[x.key]; shown[x.key]=true; save();
    if(current) queue.push(x); else showAlert(x);
  });
  // تنظيف مفاتيح الأيام السابقة
  const tk=dkey(new Date());
  Object.keys(shown).forEach(k=>{ if(k.split("|")[1]!==tk) delete shown[k]; });
  Object.keys(snooze).forEach(k=>{ if(k.split("|")[1]!==tk) delete snooze[k]; });
}

let lastDay=dkey(new Date());
setInterval(()=>{ if(dkey(new Date())!==lastDay){ lastDay=dkey(new Date()); } renderToday(); check(); },20000);
document.addEventListener("visibilitychange",()=>{ if(!document.hidden){ renderAll(); check(); } });

function toast(t){ const el=$("#toast"); el.textContent=t; el.classList.add("on"); clearTimeout(toast._t); toast._t=setTimeout(()=>el.classList.remove("on"),2200); }

consumeNative(); syncNative(); renderAll(); check();
})();
</script>
